<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Lens Library | WEBZONEBW STUDIO+</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .lens-card { border: 1px solid #38bdf8; padding: 15px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Lens Library</h1>
        <div id="lens-list" class="library-grid">Loading your lenses...</div>
    </div>
    <script>
        fetch('/api/lenses')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('lens-list');
                if(!data.success) list.innerHTML = "No active subscription found.";
                else {
                    list.innerHTML = data.lenses.map(l => `
                        <div class="lens-card">
                            <h3>${l.lensId}</h3>
                            <p>Purchased: ${new Date(l.purchaseDate).toLocaleDateString()}</p>
                            <button class="btn">Launch Lens</button>
                        </div>
                    `).join('');
                }
            });
    </script>
</body>
</html>
