<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Manager Test</title>
</head>
<body>
    <h1>License Manager Test</h1>
    <div id="status">Loading...</div>
    
    <script src="js/er-license-premium.js"></script>
    <script>
        // Test the license manager
        window.addEventListener('load', function() {
            const statusDiv = document.getElementById('status');
            
            // Check license status
            setTimeout(function() {
                const hasLicense = window.WEBZONEBW_LICENSE.hasActiveLicense();
                const status = window.WEBZONEBW_LICENSE.getStatus();
                const licenseKey = window.WEBZONEBW_LICENSE.getLicenseKey();
                
                statusDiv.innerHTML = `
                    <h2>License Status</h2>
                    <p><strong>Status:</strong> ${status}</p>
                    <p><strong>Has Active License:</strong> ${hasLicense}</p>
                    <p><strong>License Key:</strong> ${licenseKey || 'None'}</p>
                    <p><strong>Has Promo Access:</strong> ${window.WEBZONEBW_LICENSE.hasPromoAccess()}</p>
                    <p><strong>Promo Features:</strong> ${window.WEBZONEBW_LICENSE.getPromoFeatures().join(', ') || 'None'}</p>
                `;
                
                // Test Halloween status
                window.WEBZONEBW_LICENSE.getHalloweenStatus().then(function(data) {
                    if (data) {
                        statusDiv.innerHTML += `
                            <h2>Halloween Status</h2>
                            <p><strong>Promo Active:</strong> ${data.promoActive}</p>
                            <p><strong>Features:</strong> ${data.features.join(', ')}</p>
                        `;
                    }
                });
            }, 1000);
        });
    </script>
</body>
</html>
