<!--
=========================================================
WEBZONEBW — STRUCTURED DATA TEMPLATE
=========================================================

Purpose:
1. Establish WEBZONEBW as the Organization entity.
2. Establish webzonebw.in as the official WebSite entity.
3. Add Article structured data to individual Blogger posts.
4. Connect Blogger articles to the WEBZONEBW organization.

Place inside the Blogger <head> section.

IMPORTANT:
- Keep the logo URL pointed to the real live logo.
- Article dates should come from Blogger dynamically.
- Do not hard-code an individual article title or URL.
=========================================================
-->


<!-- =====================================================
     WEBZONEBW — ORGANIZATION
     ===================================================== -->

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "https://webzonebw.in/#organization",

  "name": "WEBZONEBW",

  "url": "https://webzonebw.in/",

  "logo": {
    "@type": "ImageObject",
    "@id": "https://webzonebw.in/#logo",
    "url": "https://webzonebw.in/assets/logo.png"
  },

  "description": "WEBZONEBW is a technology-focused digital portfolio, knowledge base, digital workspace, and practical project hub covering IT support, systems integration, networking, cybersecurity, web development, artificial intelligence, automation, and technology projects."
}
</script>


<!-- =====================================================
     WEBZONEBW — WEBSITE
     ===================================================== -->

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://webzonebw.in/#website",

  "url": "https://webzonebw.in/",

  "name": "WEBZONEBW",

  "description": "WEBZONEBW is a technology-focused digital portfolio, knowledge base, digital workspace, and practical project hub.",

  "publisher": {
    "@id": "https://webzonebw.in/#organization"
  },

  "inLanguage": "en"
}
</script>


<!-- =====================================================
     BLOGGER ARTICLE
     Only generated on individual post pages.
     ===================================================== -->

<b:if cond='data:blog.pageType == "item"'>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",

  "@id": "<data:blog.url.canonical/>#article",

  "headline": "<data:blog.pageName/>",

  "url": "<data:blog.url.canonical/>",

  "author": {
    "@type": "Organization",
    "@id": "https://webzonebw.in/#organization",
    "name": "WEBZONEBW",
    "url": "https://webzonebw.in/"
  },

  "publisher": {
    "@id": "https://webzonebw.in/#organization"
  },

  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "<data:blog.url.canonical/>"
  },

  "inLanguage": "en"
}

</script>

</b:if>
