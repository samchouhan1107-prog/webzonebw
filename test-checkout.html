<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Checkout Button</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-btn {
            background: linear-gradient(180deg, #ffd814, #f7ca00);
            color: #0f1111;
            border: none;
            padding: 16px 24px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(15, 17, 17, 0.15);
        }
        .test-btn:hover {
            background: linear-gradient(180deg, #f7ca00, #e8b400);
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(15, 17, 17, 0.2);
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Test Checkout Button</h1>
    <p>Click the button below to test the checkout functionality:</p>
    
    <button class="test-btn" onclick="testCheckout()">Test Place Order Button</button>
    
    <div id="status" class="status"></div>

    <script>
        function testCheckout() {
            const status = document.getElementById('status');
            status.style.display = 'block';
            status.className = 'status success';
            status.textContent = '✅ Button click detected! The checkout functionality is working.';
            
            // Simulate the checkout process
            setTimeout(() => {
                status.textContent = '✅ Test completed successfully! The yellow button is performing its task.';
            }, 1500);
        }
    </script>
</body>
</html>
